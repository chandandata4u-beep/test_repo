name: Security Scan Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  gitleaks_scan:
    runs-on: ubuntu-latest
    container:
      image: zricethezav/gitleaks:latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Gitleaks scan
        run: |
          echo "Running gitleaks secret scan (using .gitleaks.toml)..."

          test -f .gitleaks.toml || (echo "ERROR: .gitleaks.toml not found" && exit 2)

          # STEP 1: Always generate report (never depend on exit code)
          gitleaks detect \
            --source . \
            --no-git \
            --config .gitleaks.toml \
            --report-format json \
            --report-path gitleaks-report.json

          echo "Gitleaks scan completed"

          # Ensure file exists
          test -f gitleaks-report.json || echo "[]" > gitleaks-report.json

          # STEP 2: Decide failure based on output
          COUNT=$(grep -c "RuleID" gitleaks-report.json || true)

          echo "Findings count: $COUNT"

          if [ "$COUNT" -gt 0 ]; then
            echo "❌ Secrets detected. Failing pipeline."
            exit 1
          else
            echo "✅ No secrets found."
          fi

      - name: Upload gitleaks report
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.json


  convert_secret_report:
    runs-on: ubuntu-latest
    needs: gitleaks_scan
    if: success()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download gitleaks artifact
        uses: actions/download-artifact@v4
        with:
          name: gitleaks-report

      - name: Generate CSV
        run: |
          echo "Generating secrets-findings.csv..."

          cat > convert_gitleaks.py <<'PY'
          import json, csv, os

          inp = "gitleaks-report.json"
          out = "secrets-findings.csv"

          findings = []

          if os.path.exists(inp) and os.path.getsize(inp) > 0:
              with open(inp, "r", encoding="utf-8") as f:
                  try:
                      data = json.load(f)
                  except Exception:
                      data = {}

              if isinstance(data, list):
                  findings = data
              elif isinstance(data, dict):
                  findings = data.get("findings", [])

          def mask(v):
              if not v:
                  return ""
              if len(v) <= 6:
                  return "***"
              return v[:3] + "*" * (len(v) - 6) + v[-3:]

          with open(out, "w", newline="", encoding="utf-8") as f:
              w = csv.writer(f)
              w.writerow(["file", "line", "rule", "secret_masked"])

              for i in findings:
                  w.writerow([
                      i.get("File") or i.get("file"),
                      i.get("StartLine") or i.get("line"),
                      i.get("RuleID") or i.get("rule"),
                      mask(i.get("Secret", "")),
                  ])

          print(f"CSV generated with {len(findings)} findings")
          PY

          python convert_gitleaks.py

      - name: Upload CSV report
        uses: actions/upload-artifact@v4
        with:
          name: secrets-findings
          path: secrets-findings.csv


  pylint_scan:
    runs-on: ubuntu-latest
    needs: convert_secret_report
    if: success()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pylint
        run: pip install --no-cache-dir pylint

      - name: Run pylint scan
        run: |
          echo "Running pylint scan..."

          FILES="$(git ls-files '*.py')"

          if [ -z "$FILES" ]; then
            echo "No Python files found"
            echo "[]" > pylint-report.json
          else
            pylint $FILES --output-format=json > pylint-report.json || true
          fi

      - name: Generate pylint CSV
        run: |
          python - <<'PY'
          import json, csv, os

          jf = "pylint-report.json"
          cf = "pylint-findings.csv"

          with open(cf, "w", newline="", encoding="utf-8") as f:
              w = csv.writer(f)
              w.writerow(["file", "line", "message", "severity", "rule"])

              if os.path.exists(jf) and os.path.getsize(jf) > 0:
                  try:
                      issues = json.load(open(jf))
                  except Exception:
                      issues = []

                  for i in issues:
                      w.writerow([
                          i.get("path"),
                          i.get("line"),
                          i.get("message"),
                          i.get("type"),
                          i.get("symbol")
                      ])

          print("pylint CSV created")
          PY

      - name: Upload pylint reports
        uses: actions/upload-artifact@v4
        with:
          name: pylint-reports
          path: |
            pylint-report.json
            pylint-findings.csv
