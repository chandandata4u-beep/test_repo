name: Security Scans (Gitleaks + Pylint)

on:
  pull_request:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks_scan:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Run gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        with:
          args: detect --source . --no-git --report-format json --report-path gitleaks-report.json --exit-code 1 --verbose

      - name: Upload gitleaks report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.json

  convert_secret_report:
    runs-on: ubuntu-latest
    needs: [gitleaks_scan]
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Download gitleaks report (if present)
        uses: actions/download-artifact@v4
        with:
          name: gitleaks-report
          path: .
        continue-on-error: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Convert gitleaks report to CSV
        run: |
          python - <<'PY'
          import json, csv, os
          input_file = "gitleaks-report.json"
          output_file = "secrets-findings.csv"

          if not os.path.exists(input_file):
              print("No gitleaks report found, creating empty CSV")
              with open(output_file, "w", newline="") as f:
                  csv.writer(f).writerow(["file","line","rule","secret_masked"])
          else:
              with open(input_file) as f:
                  data = json.load(f)
              findings = data if isinstance(data, list) else data.get("findings", [])
              with open(output_file, "w", newline="") as f:
                  w = csv.writer(f)
                  w.writerow(["file","line","rule","secret_masked"])
                  for item in findings:
                      secret = item.get("Secret","") or ""
                      masked = (secret[:4] + "*"*max(0,len(secret)-7) + secret[-3:]) if secret else ""
                      w.writerow([item.get("File"), item.get("StartLine"), item.get("RuleID"), masked])
              print(f"CSV generated: {output_file} ({len(findings)} secrets)")
          PY

      - name: Upload secrets CSV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secrets-findings
          path: secrets-findings.csv

  pylint_scan:
    runs-on: ubuntu-latest
    needs: [convert_secret_report]
    if: always()
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install pylint
        run: pip install --no-cache-dir pylint

      - name: Run pylint scan
        run: |
          echo "Running pylint scan on Python files..."
          pylint $(git ls-files '*.py') --output-format=json > pylint-report.json || true

      - name: Convert pylint report to CSV
        run: |
          python - <<'PY'
          import json, csv, os
          json_file = "pylint-report.json"
          csv_file = "pylint-findings.csv"

          with open(csv_file, "w", newline="") as f:
              w = csv.writer(f)
              w.writerow(["file","line","message","severity","rule"])

              if os.path.exists(json_file) and os.path.getsize(json_file) > 0:
                  try:
                      issues = json.load(open(json_file))
                      for i in issues:
                          w.writerow([i.get("path"), i.get("line"), i.get("message"), i.get("type"), i.get("symbol")])
                  except Exception as e:
                      print("Error parsing pylint JSON:", e)
              else:
                  print("No pylint issues detected or JSON file empty")

          print("pylint-findings.csv created")
          PY

      - name: Upload pylint artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pylint-reports
          path: |
            pylint-report.json
            pylint-findings.csv
