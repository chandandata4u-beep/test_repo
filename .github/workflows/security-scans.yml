name: Security Scan Pipeline
on:
  push:
    branches: ["*"]
  pull_request:
    branches: [main]

jobs:

# -----------------------------
# GITLEAKS SCAN
# -----------------------------
  gitleaks_scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run gitleaks scan
        id: gitleaks
        run: |
          echo "Running gitleaks secret scan..."

          test -f .gitleaks.toml || (echo "ERROR: missing config" && exit 2)

          docker run --rm \
            -v "$PWD:/repo" \
            -w /repo \
            zricethezav/gitleaks:latest \
            detect \
              --source . \
              --no-git \
              --config /repo/.gitleaks.toml \
              --report-format json \
              --report-path /repo/gitleaks-report.json \
              --exit-code 1

          # ensure file always exists
          if [ ! -s gitleaks-report.json ]; then
            echo "[]" > gitleaks-report.json
          fi

          COUNT=$(grep -c "RuleID" gitleaks-report.json || true)
          echo "findings=$COUNT" >> $GITHUB_OUTPUT

      - name: Upload gitleaks report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.json


# -----------------------------
# CONVERT JSON → CSV
# -----------------------------
  convert_secret_report:
    runs-on: ubuntu-latest
    needs: gitleaks_scan
    if: always()

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: gitleaks-report

      - name: Generate CSV from gitleaks JSON
        run: |
          python3 - <<'PY'
          import json, csv, os

          inp = "gitleaks-report.json"
          out = "secrets-findings.csv"

          findings = []

          if os.path.exists(inp) and os.path.getsize(inp) > 0:
              try:
                  data = json.load(open(inp))
              except:
                  data = []

              if isinstance(data, list):
                  findings = data
              elif isinstance(data, dict):
                  findings = data.get("findings", []) or []

          def mask(v):
              if not v:
                  return ""
              if len(v) <= 6:
                  return "***"
              return v[:3] + "*" * (len(v) - 6) + v[-3:]

          with open(out, "w", newline="") as f:
              w = csv.writer(f)
              w.writerow(["file", "line", "rule", "secret_masked"])

              for i in findings:
                  w.writerow([
                      i.get("File"),
                      i.get("StartLine"),
                      i.get("RuleID"),
                      mask(i.get("Secret", "")),
                  ])

          print("CSV generated:", out, "findings:", len(findings))
          PY

      - name: Upload CSV
        uses: actions/upload-artifact@v4
        with:
          name: secrets-csv
          path: secrets-findings.csv


# -----------------------------
# PYLINT SCAN
# -----------------------------
  pylint_scan:
    runs-on: ubuntu-latest
    needs: convert_secret_report
    if: always()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pylint
        run: pip install --no-cache-dir pylint

      - name: Run pylint
        run: |
          FILES="$(git ls-files '*.py')"

          if [ -z "$FILES" ]; then
            echo "[]" > pylint-report.json
          else
            pylint $FILES --output-format=json > pylint-report.json || true
          fi

      - name: Generate pylint CSV
        run: |
          python3 - <<'PY'
          import json, csv, os

          inp = "pylint-report.json"
          out = "pylint-findings.csv"

          issues = []

          if os.path.exists(inp) and os.path.getsize(inp) > 0:
              try:
                  issues = json.load(open(inp))
              except:
                  issues = []

          with open(out, "w", newline="") as f:
              w = csv.writer(f)
              w.writerow(["file", "line", "message", "severity", "rule"])

              for i in issues:
                  w.writerow([
                      i.get("path"),
                      i.get("line"),
                      i.get("message"),
                      i.get("type"),
                      i.get("symbol"),
                  ])

          print("pylint CSV created")
          PY

      - name: Upload pylint reports
        uses: actions/upload-artifact@v4
        with:
          name: pylint-reports
          path: |
            pylint-report.json
            pylint-findings.csv
