name: Security Scans (Gitleaks SARIF -> CSV + Pylint)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks_scan:
    name: Gitleaks Scan (SARIF)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2

      # DO NOT upload SARIF yourself — the action already produces the artifact
      - name: Note
        if: always()
        run: echo "Gitleaks action produces artifact named gitleaks-results.sarif"

  convert_secret_report:
    name: Convert Gitleaks SARIF to CSV
    runs-on: ubuntu-latest
    needs: [gitleaks_scan]
    if: always()
    steps:
      - name: Download gitleaks SARIF artifact (produced by gitleaks action)
        uses: actions/download-artifact@v4
        with:
          name: gitleaks-results.sarif
          path: .

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Convert SARIF -> CSV
        run: |
          python - <<'PY'
          import json, csv, os

          sarif_file = "gitleaks-results.sarif"
          csv_file = "secrets-findings.csv"

          with open(csv_file, "w", newline="", encoding="utf-8") as f:
              w = csv.writer(f)
              w.writerow(["file", "line", "rule", "message"])

              if not os.path.exists(sarif_file):
                  print("SARIF artifact not found after download.")
                  raise SystemExit(0)

              data = json.load(open(sarif_file, "r", encoding="utf-8"))
              rows = 0

              for run in data.get("runs", []):
                  for r in run.get("results", []):
                      rule = r.get("ruleId", "") or ""
                      msg = (r.get("message", {}) or {}).get("text", "") or ""

                      locs = r.get("locations", []) or []
                      if not locs:
                          continue

                      phys = (locs[0].get("physicalLocation", {}) or {})
                      file_ = (phys.get("artifactLocation", {}) or {}).get("uri", "") or ""
                      region = (phys.get("region", {}) or {})
                      line = region.get("startLine", "") or ""

                      w.writerow([file_, line, rule, msg])
                      rows += 1

          print(f"CSV generated: {csv_file} ({rows} findings)")
          PY

      - name: Upload secrets CSV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secrets-findings
          path: secrets-findings.csv

  pylint_scan:
    name: Pylint Scan (JSON -> CSV)
    runs-on: ubuntu-latest
    needs: [convert_secret_report]
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pylint
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir pylint

      - name: Run pylint (JSON)
        run: |
          PY_FILES=$(git ls-files '*.py' || true)
          if [ -z "$PY_FILES" ]; then
            echo "[]" > pylint-report.json
          else
            pylint $PY_FILES --output-format=json > pylint-report.json || true
            if [ ! -s pylint-report.json ]; then
              echo "[]" > pylint-report.json
            fi
          fi

      - name: Convert pylint JSON -> CSV
        run: |
          python - <<'PY'
          import json, csv, os

          json_file = "pylint-report.json"
          csv_file = "pylint-findings.csv"

          issues = []
          if os.path.exists(json_file) and os.path.getsize(json_file) > 0:
              try:
                  issues = json.load(open(json_file, "r", encoding="utf-8"))
              except Exception:
                  issues = []

          with open(csv_file, "w", newline="", encoding="utf-8") as f:
              w = csv.writer(f)
              w.writerow(["file", "line", "message", "severity", "rule"])
              for i in issues:
                  w.writerow([
                      i.get("path"),
                      i.get("line"),
                      i.get("message"),
                      i.get("type"),
                      i.get("symbol")
                  ])
          print("pylint-findings.csv created")
          PY

      - name: Upload pylint artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pylint-reports
          path: |
            pylint-report.json
            pylint-findings.csv
