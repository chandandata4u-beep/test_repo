name: Security Scans (Gitleaks + Pylint)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks_scan:
    name: Gitleaks Scan
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        with:
          args: detect --source . --no-git --report-format json --report-path gitleaks-report.json --exit-code 1 --verbose

      # IMPORTANT: Always create a valid report so the artifact always exists
      - name: Ensure gitleaks report exists
        if: always()
        run: |
          if [ ! -f gitleaks-report.json ]; then
            echo "[]" > gitleaks-report.json
          fi

      - name: Upload gitleaks report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          if-no-files-found: warn

  convert_secret_report:
    name: Convert Gitleaks JSON to CSV
    runs-on: ubuntu-latest
    needs: [gitleaks_scan]
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download gitleaks report artifact
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: gitleaks-report
          path: .

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Convert to CSV
        run: |
          python - <<'PY'
          import json, csv, os

          input_file = "gitleaks-report.json"
          output_file = "secrets-findings.csv"

          # If artifact is missing for some reason, still create an empty CSV
          if not os.path.exists(input_file):
              with open(output_file, "w", newline="") as f:
                  csv.writer(f).writerow(["file", "line", "rule", "secret_masked"])
              print("No gitleaks report found; created empty CSV.")
              raise SystemExit(0)

          with open(input_file, "r", encoding="utf-8") as f:
              try:
                  data = json.load(f)
              except Exception:
                  data = []

          findings = data if isinstance(data, list) else data.get("findings", [])

          with open(output_file, "w", newline="", encoding="utf-8") as f:
              w = csv.writer(f)
              w.writerow(["file", "line", "rule", "secret_masked"])
              for item in findings:
                  secret = item.get("Secret", "") or ""
                  masked = (secret[:4] + "*" * max(0, len(secret) - 7) + secret[-3:]) if secret else ""
                  w.writerow([
                      item.get("File"),
                      item.get("StartLine"),
                      item.get("RuleID"),
                      masked
                  ])

          print(f"CSV generated: {output_file} ({len(findings)} secrets)")
          PY

      - name: Upload secrets CSV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secrets-findings
          path: secrets-findings.csv
          if-no-files-found: warn

  pylint_scan:
    name: Pylint Scan
    runs-on: ubuntu-latest
    needs: [convert_secret_report]
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install pylint
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir pylint

      - name: Run pylint JSON
        run: |
          # If repo has no Python files, don't fail the job; create empty report
          PY_FILES=$(git ls-files '*.py' || true)
          if [ -z "$PY_FILES" ]; then
            echo "[]" > pylint-report.json
            echo "No Python files found; created empty pylint report."
            exit 0
          fi

          pylint $PY_FILES --output-format=json > pylint-report.json || true

          # Ensure file exists even if pylint produced nothing
          if [ ! -s pylint-report.json ]; then
            echo "[]" > pylint-report.json
          fi

      - name: Convert pylint JSON -> CSV
        run: |
          python - <<'PY'
          import json, csv, os

          json_file = "pylint-report.json"
          csv_file = "pylint-findings.csv"

          issues = []
          if os.path.exists(json_file) and os.path.getsize(json_file) > 0:
              try:
                  issues = json.load(open(json_file, "r", encoding="utf-8"))
              except Exception:
                  issues = []

          with open(csv_file, "w", newline="", encoding="utf-8") as f:
              w = csv.writer(f)
              w.writerow(["file", "line", "message", "severity", "rule"])
              for i in issues:
                  w.writerow([
                      i.get("path"),
                      i.get("line"),
                      i.get("message"),
                      i.get("type"),
                      i.get("symbol")
                  ])

          print("pylint-findings.csv created")
          PY

      - name: Upload pylint artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pylint-reports
          path: |
            pylint-report.json
            pylint-findings.csv
          if-no-files-found: warn
