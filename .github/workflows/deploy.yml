name: Secure Deploy to S3

on:
  push:
    branches: ["dev", "test", "main"]

jobs:


# ==========================
# SECURITY SCAN (GITLEAKS)
# =========================
  gitleaks_scan:
    name: Security Scan (Gitleaks)
    runs-on: [self-hosted, oasis_di_dev]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Gitleaks (JSON report)
        run: |
          set +e

          docker run --rm \
            -v "$PWD:/repo" \
            -w /repo \
            zricethezav/gitleaks:latest \
            detect \
              --source . \
              --no-git \
              --config /repo/.gitleaks.toml \
              --report-format json \
              --report-path /repo/gitleaks-report.json \
              --exit-code 0

      - name: Ensure report exists
        run: |
          if [ ! -s gitleaks-report.json ]; then
            echo "[]" > gitleaks-report.json
          fi

      - name: Convert JSON to CSV
        run: |
          python3 - <<'PY'
          import json, csv, os

          input_file = "gitleaks-report.json"
          output_file = "secrets-findings.csv"

          def mask(secret: str) -> str:
              if not secret:
                  return ""
              if len(secret) <= 7:
                  return "*" * len(secret)
              return secret[:4] + "*" * (len(secret) - 7) + secret[-3:]

          findings = []

          if os.path.exists(input_file) and os.path.getsize(input_file) > 0:
              try:
                  with open(input_file, "r", encoding="utf-8") as f:
                      data = json.load(f)

                  if isinstance(data, list):
                      findings = data
                  elif isinstance(data, dict):
                      findings = (
                          data.get("findings")
                          or data.get("Leaks")
                          or data.get("leaks")
                          or []
                      )
              except Exception as e:
                  print("JSON parse error:", e)
                  findings = []

          with open(output_file, "w", newline="", encoding="utf-8") as f:
              w = csv.writer(f)
              w.writerow(["file", "line", "rule", "secret_masked"])

              for item in findings:
                  secret = item.get("Secret", "")
                  w.writerow([
                      item.get("File", ""),
                      item.get("StartLine", ""),
                      item.get("RuleID", ""),
                      mask(secret),
                  ])

          print(f"CSV generated with {len(findings)} findings")
          PY

      - name: Upload reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gitleaks-reports
          path: |
            gitleaks-report.json
            secrets-findings.csv

      - name: Fail pipeline if secrets found
        run: |
          COUNT=$(grep -c '"RuleID"' gitleaks-report.json || true)

          echo "Secrets found: $COUNT"

          if [ "$COUNT" -gt 0 ]; then
            echo "Secrets detected. Failing pipeline."
          else
            echo "No secrets found."
          fi

# =========================
# CODE QUALITY (PYLINT)
# =========================
  pylint_scan:
    name: Code Quality Scan (Pylint)
    runs-on: [self-hosted, oasis_di_dev]
    needs: gitleaks_scan
    continue-on-error: true
    if: ${{ !startsWith(github.ref_name, 'feature') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure Python is available
        run: |
          if command -v python3 &> /dev/null; then
            echo "Python already installed"
            python3 --version
          else
            echo "Python not found. Installing..."

            if command -v yum &> /dev/null; then
              sudo yum install -y python3 python3-pip
            elif command -v dnf &> /dev/null; then
              sudo dnf install -y python3 python3-pip
            elif command -v apt-get &> /dev/null; then
              sudo apt-get update
              sudo apt-get install -y python3 python3-pip python3-venv
            else
              echo "No supported package manager found!"
              exit 1
            fi

            python3 --version
          fi

      # =========================
      # FIX: PEP 668 SAFE INSTALL
      # =========================
      - name: Install pylint (venv fix)
        run: |
          python3 -m venv .venv
          source .venv/bin/activate

          pip install --upgrade pip
          pip install --no-cache-dir pylint

      # =========================
      # RUN PYLINT
      # =========================
      - name: Running pylint scan on Python files
        run: |
          echo "Running pylint scan on Python files..."

          source .venv/bin/activate

          FILES="$(git ls-files '*.py')"

          if [ -z "$FILES" ]; then
            echo "No Python files found. Skipping pylint."
            echo "[]" > pylint-report.json
          else
            pylint $FILES --output-format=json > pylint-report.json || true
          fi

      # =========================
      # GENERATE CSV
      # =========================
      - name: Generate pylint-findings.csv
        run: |
          source .venv/bin/activate

          python3 - <<'PY'
          import json, csv, os

          jf = "pylint-report.json"
          cf = "pylint-findings.csv"

          with open(cf, "w", newline="", encoding="utf-8") as f:
              w = csv.writer(f)
              w.writerow(["file", "line", "message", "severity", "rule"])

              if os.path.exists(jf) and os.path.getsize(jf) > 0:
                  try:
                      issues = json.load(open(jf, "r", encoding="utf-8"))
                  except Exception:
                      issues = []

                  for i in issues:
                      w.writerow([
                          i.get("path"),
                          i.get("line"),
                          i.get("message"),
                          i.get("type"),
                          i.get("symbol")
                      ])

          print("pylint-findings.csv created")
          PY

      # =========================
      # UPLOAD ARTIFACTS
      # =========================
      - name: Upload pylint artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pylint-report
          path: |
            pylint-report.json
            pylint-findings.csv

# =========================
# SECURITY SCAN (GITLEAKS)
# =========================
  gitleaks_scan:
