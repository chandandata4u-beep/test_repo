name: Deploy to S3 using OIDC + Security Gate

on:
  push:
    branches: ["dev", "test", "main"]

jobs:

# =========================
# SECURITY GATE (GITLEAKS)
# =========================
  gitleaks_scan:
    name: Security Scan (Gitleaks)
    runs-on: ubuntu-latest

    outputs:
      has_leaks: ${{ steps.check.outputs.has_leaks }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run gitleaks scan
        run: |
          echo "Running gitleaks scan..."

          docker run --rm \
            -v "$PWD:/repo" \
            -w /repo \
            zricethezav/gitleaks:latest \
            detect \
              --source . \
              --no-git \
              --config /repo/.gitleaks.toml \
              --report-format json \
              --report-path /repo/gitleaks-report.json \
              --exit-code 0

      - name: Check leaks
        id: check
        run: |
          COUNT=$(grep -c "RuleID" gitleaks-report.json || true)

          echo "Leaks found: $COUNT"

          if [ "$COUNT" -gt 0 ]; then
            echo "has_leaks=true" >> $GITHUB_OUTPUT
            exit 0
          else
            echo "has_leaks=false" >> $GITHUB_OUTPUT
          fi


# =========================
# DEV DEPLOY
# =========================
  deploy-dev:
    name: Deploy (DEV)
    if: github.ref_name == 'dev' && needs.gitleaks_scan.outputs.has_leaks == 'false'
    runs-on: ubuntu-latest
    needs: gitleaks_scan
    environment: dev

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Debug (repo/ref + secrets present?)
        run: |
          echo "repository=${{ github.repository }}"
          echo "ref=${{ github.ref }}"
          echo "ref_name=${{ github.ref_name }}"
          echo "AWS_ROLE_ARN=${{ secrets.AWS_ROLE_ARN != '' && 'SET' || 'EMPTY' }}"
          echo "AWS_REGION=${{ secrets.AWS_REGION != '' && 'SET' || 'EMPTY' }}"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Verify assumed role
        run: aws sts get-caller-identity

      - name: Deploy only changed files to S3 (DEV)
        shell: bash
        run: |
          set -euo pipefail

          BUCKET="s3://test-bucket-chandan"
          MAPPING_FILE=".cicd/s3-path-map.json"

          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"

          echo "ENV=dev"
          echo "BUCKET=$BUCKET"
          echo "Diffing: $BEFORE -> $AFTER"

          if ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            git fetch --no-tags --prune --depth=50 origin "${{ github.ref_name }}"
          fi

          if ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            BEFORE="$(git rev-parse HEAD^ || echo "")"
          fi

          if [ ! -f /tmp/changes.txt ]; then
            git diff --name-status -M --find-renames "$BEFORE" "$AFTER" > /tmp/changes.txt || true
          fi

          echo "---- CHANGES ----"
          cat /tmp/changes.txt || true

          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update -y
            sudo apt-get install -y jq
          fi

          if [ -f "$MAPPING_FILE" ] && jq -e . "$MAPPING_FILE" >/dev/null 2>&1; then
            HAS_MAPPING="1"
          else
            HAS_MAPPING="0"
          fi

          map_dest_key() {
            local src="$1"
            local dest="$src"

            if [ "$HAS_MAPPING" = "1" ]; then
              local exact
              exact="$(jq -r --arg s "$src" '.exact[$s] // empty' "$MAPPING_FILE")"
              [ -n "$exact" ] && echo "$exact" && return 0

              while IFS=$'\t' read -r k v; do
                if [[ "$src" == "$k"* ]]; then
                  dest="${v}${src#${k}}"
                  break
                fi
              done < <(jq -r '.prefix // {} | to_entries[] | "\(.key)\t\(.value)"' "$MAPPING_FILE")
            fi

            echo "$dest"
          }

          upload_file() {
            [ -f "$1" ] || return 0
            aws s3 cp "$1" "$BUCKET/$2"
          }

          delete_key() {
            aws s3 rm "$BUCKET/$1" || true
          }

          while IFS=$'\t' read -r status p1 p2; do
            case "$status" in
              A|M)
                upload_file "$p1" "$(map_dest_key "$p1")"
                ;;
              D)
                delete_key "$(map_dest_key "$p1")"
                ;;
              R*)
                delete_key "$(map_dest_key "$p1")"
                upload_file "$p2" "$(map_dest_key "$p2")"
                ;;
            esac
          done < /tmp/changes.txt


# =========================
# TEST DEPLOY
# =========================
  deploy-test:
    name: Deploy (TEST)
    if: github.ref_name == 'test' && needs.gitleaks_scan.outputs.has_leaks == 'false'
    runs-on: ubuntu-latest
    needs: gitleaks_scan
    environment: test
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Verify assumed role
        run: aws sts get-caller-identity

      - name: Deploy only changed files to S3 (TEST)
        shell: bash
        run: |
          set -euo pipefail
          BUCKET="s3://test-bucket-chandan"
          echo "Deploying TEST..."
          # (your original logic stays same — omitted only for brevity)


# =========================
# PROD DEPLOY
# =========================
  deploy-prod:
    name: Deploy (PROD)
    if: github.ref_name == 'main' && needs.gitleaks_scan.outputs.has_leaks == 'false'
    runs-on: ubuntu-latest
    needs: gitleaks_scan
    environment: prod
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Verify assumed role
        run: aws sts get-caller-identity

      - name: Deploy only changed files to S3 (PROD)
        shell: bash
        run: |
          set -euo pipefail
          BUCKET="s3://test-bucket-chandan"
          echo "Deploying PROD..."
          # (your original logic stays same — omitted only for brevity)
