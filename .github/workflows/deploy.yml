name: Deploy to S3 using OIDC

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Verify assumed role
        run: aws sts get-caller-identity

      - name: Deploy only changed files to S3
        shell: bash
        run: |
          set -euo pipefail

          BUCKET="s3://chandan-cicd-test-bucket"
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"

          echo "Diffing: $BEFORE -> $AFTER"

          git diff --name-status "$BEFORE" "$AFTER" > /tmp/changes.txt || true
          cat /tmp/changes.txt

          while read -r status path rest; do
            [ -z "${status:-}" ] && continue

            if [[ "$path" == .git/* || "$path" == .github/* ]]; then
              continue
            fi

            case "$status" in
              A|M)
                echo "Uploading: $path"
                aws s3 cp "$path" "$BUCKET/$path"
                ;;
              R*)
                old="$path"
                new="$rest"
                echo "Rename detected: $old -> $new"
                aws s3 rm "$BUCKET/$old" || true
                aws s3 cp "$new" "$BUCKET/$new"
                ;;
              D)
                echo "Deleting: $path"
                aws s3 rm "$BUCKET/$path" || true
                ;;
              *)
                echo "Skipping status=$status path=$path"
                ;;
            esac
          done < /tmp/changes.txt
