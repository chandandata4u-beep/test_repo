name: Deploy to S3 using OIDC

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Verify assumed role
        run: aws sts get-caller-identity

      - name: Deploy only changed files to S3 (with optional mapping)
        shell: bash
        run: |
          set -euo pipefail

          BUCKET="s3://chandan-cicd-test-bucket"
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"
          MAP_FILE=".cicd/s3-path-map.json"

          echo "Diffing: $BEFORE -> $AFTER"

          # name-status output is TAB-separated; rename lines have 3 fields.
          git diff --name-status "$BEFORE" "$AFTER" > /tmp/changes.txt || true
          echo "Changes:"
          cat /tmp/changes.txt || true

          map_to_s3_key () {
            local local_path="$1"
            python3 - "$local_path" "$MAP_FILE" <<'PY'
import json, os, sys

local_path = sys.argv[1]
map_file = sys.argv[2]

# Default: same path as repo
exact = {}
prefix = {}

if os.path.isfile(map_file):
    with open(map_file, "r", encoding="utf-8") as f:
        m = json.load(f)
    exact = m.get("exact", {}) or {}
    prefix = m.get("prefix", {}) or {}

# Exact match wins
if local_path in exact:
    print(exact[local_path])
    raise SystemExit(0)

# Longest prefix wins
best_src = None
best_dst = None
for src, dst in prefix.items():
    if local_path.startswith(src):
        if best_src is None or len(src) > len(best_src):
            best_src, best_dst = src, dst

if best_src:
    print(best_dst + local_path[len(best_src):])
else:
    print(local_path)
PY
          }

          # Read TAB-separated fields safely
          while IFS=$'\t' read -r status path rest; do
            [[ -z "${status:-}" ]] && continue

            # Ignore CI metadata
            if [[ "$path" == .git/* || "$path" == .github/* ]]; then
              continue
            fi

            case "$status" in
              A|M)
                s3_key="$(map_to_s3_key "$path")"
                echo "Uploading: $path -> $BUCKET/$s3_key"
                aws s3 cp "$path" "$BUCKET/$s3_key"
                ;;

              D)
                del_key="$(map_to_s3_key "$path")"
                echo "Deleting: $path -> $BUCKET/$del_key"
                aws s3 rm "$BUCKET/$del_key" || true
                ;;

              R*)
                old="$path"
                new="$rest"

                # Ignore CI metadata rename too
                if [[ "$new" == .git/* || "$new" == .github/* ]]; then
                  continue
                fi

                old_key="$(map_to_s3_key "$old")"
                new_key="$(map_to_s3_key "$new")"

                echo "Rename: $old -> $new"
                echo "S3: $old_key -> $new_key"

                aws s3 rm "$BUCKET/$old_key" || true
                aws s3 cp "$new" "$BUCKET/$new_key"
                ;;

              *)
                echo "Skipping: status=$status path=$path rest=${rest:-}"
                ;;
            esac
          done < /tmp/changes.txt
