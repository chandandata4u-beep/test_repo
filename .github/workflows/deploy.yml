# =========================
# PYLINT (SELF-HOSTED SAFE)
# =========================
  pylint_scan:
    name: Code Quality Scan (Pylint)
    runs-on: [self-hosted, oasis_di_dev]
    needs: gitleaks_scan
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Run pylint
        run: |
          FILES="$(git ls-files '*.py')"

          if [ -z "$FILES" ]; then
            echo "[]" > pylint-report.json
          else
            pylint $FILES --output-format=json > pylint-report.json || true
          fi

# =========================
# DEV DEPLOY
# =========================
  deploy-dev:
    name: Deploy DEV to S3
    runs-on: [self-hosted, oasis_di_dev]
    needs: [gitleaks_scan, pylint_scan]
    if: github.ref_name == 'dev'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Deploy DEV
        shell: bash
        run: |
          set -euo pipefail

          MAPPING_FILE="file-mapping.json"

          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"

          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            git ls-files > /tmp/changes.txt
            sed -i 's/^/A\t/' /tmp/changes.txt
          else
            git diff --name-status -M "$BEFORE" "$AFTER" > /tmp/changes.txt || true
          fi

          while IFS=$'\t' read -r status p1 p2; do
            case "$status" in
              A|M) FILE="$p1" ;;
              D) FILE="$p1" ;;
              R*) FILE="$p2" ;;
              *) continue ;;
            esac

            MATCH_FOUND=false

            while IFS='=' read -r SRC TARGET; do
              SRC=$(echo "$SRC" | xargs)
              TARGET=$(echo "$TARGET" | xargs)

              [[ -z "$SRC" || -z "$TARGET" ]] && continue

              if [[ "$FILE" == $SRC/* ]]; then
                MATCH_FOUND=true
                REL="${FILE#$SRC/}"
                DEST="$TARGET$REL"

                if [[ "$status" == "D" ]]; then
                  aws s3 rm "$DEST" || true
                else
                  aws s3 cp "$FILE" "$DEST"
                fi
                break
              fi
            done < "$MAPPING_FILE"

            if [ "$MATCH_FOUND" = false ]; then
              echo "WARNING (DEV): No mapping for $FILE"
            fi

          done < /tmp/changes.txt

