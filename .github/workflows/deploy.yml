name: Deploy to S3 using OIDC

on:
  push:
    branches: ["dev", "test", "main"]

jobs:
  deploy-dev:
    name: Deploy (DEV)
    if: github.ref_name == 'dev'
    runs-on: ubuntu-latest
    environment: dev

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - run: aws sts get-caller-identity

      - name: Deploy only changed files (DEV)
        shell: bash
        run: |
          set -euo pipefail

          BUCKET="s3://chandan-cicd-test-bucket-dev"

          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"

          echo "ENV=dev"
          echo "BUCKET=$BUCKET"
          echo "Diffing: $BEFORE -> $AFTER"

          if ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            git fetch --no-tags --prune --depth=50 origin "${{ github.ref_name }}"
          fi

          if ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            if git rev-parse HEAD^ >/dev/null 2>&1; then
              BEFORE="$(git rev-parse HEAD^)"
            else
              git ls-files > /tmp/all_files.txt
              : > /tmp/changes.txt
              while read -r f; do
                echo -e "A\t$f" >> /tmp/changes.txt
              done < /tmp/all_files.txt
            fi
          fi

          if [ ! -f /tmp/changes.txt ]; then
            git diff --name-status -M --find-renames "$BEFORE" "$AFTER" > /tmp/changes.txt || true
          fi

          upload_file() {
            local src="$1"
            [ -f "$src" ] || return 0
            echo "Uploading: $src -> $BUCKET/$src"
            aws s3 cp "$src" "$BUCKET/$src"
          }

          delete_file() {
            local src="$1"
            echo "Deleting: $BUCKET/$src"
            aws s3 rm "$BUCKET/$src" || true
          }

          [ -s /tmp/changes.txt ] || exit 0

          while IFS=$'\t' read -r status p1 p2; do
            [ -z "${status:-}" ] && continue
            [[ "${p1:-}" == .git/* || "${p1:-}" == .github/* ]] && continue

            case "$status" in
              A|M)
                upload_file "$p1"
                ;;
              D)
                delete_file "$p1"
                ;;
              R*)
                delete_file "$p1"
                upload_file "$p2"
                ;;
            esac
          done < /tmp/changes.txt


  deploy-test:
    name: Deploy (TEST)
    if: github.ref_name == 'test'
    runs-on: ubuntu-latest
    environment: test

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - run: aws sts get-caller-identity

      - name: Deploy to TEST bucket
        run: |
          BUCKET="s3://chandan-cicd-test-bucket-test"
          echo "Deploying to $BUCKET"
          aws s3 sync . "$BUCKET" --exclude ".git/*" --exclude ".github/*"


  deploy-prod:
    name: Deploy (PROD)
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    environment: prod

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - run: aws sts get-caller-identity

      - name: Deploy to PROD bucket
        run: |
          BUCKET="s3://chandan-cicd-test-bucket"
          echo "Deploying to $BUCKET"
          aws s3 sync . "$BUCKET" --exclude ".git/*" --exclude ".github/*"
