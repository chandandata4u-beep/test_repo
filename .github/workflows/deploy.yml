name: Secure Deploy to S3 (EC2 Runner + Gitleaks)

on:
  push:
    branches: ["dev", "test", "main"]

jobs:

# ==========================
# SECURITY SCAN (GITLEAKS)
# ==========================
  gitleaks_scan:
    name: Security Scan (Gitleaks)
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Verify EC2 runner
      - name: Verify EC2 runner
        run: |
          echo "Running on:"
          hostname

      # Run Gitleaks using Docker
      - name: Run Gitleaks (Docker)
        run: |
          set +e

          docker run --rm \
            -v "$PWD:/repo" \
            -w /repo \
            zricethezav/gitleaks:latest \
            detect \
              --source . \
              --no-git \
              --config /repo/.gitleaks.toml \
              --report-format json \
              --report-path /repo/gitleaks-report.json \
              --exit-code 1

          EXIT_CODE=$?
          echo "exit_code=$EXIT_CODE" > gitleaks-status.txt

      # Ensure report exists
      - name: Ensure report exists
        run: |
          if [ ! -s gitleaks-report.json ]; then
            echo "[]" > gitleaks-report.json
          fi

      # Convert JSON to CSV
      - name: Convert JSON -> CSV (masked)
        run: |
          python3 - <<'PY'
          import json, csv, os

          input_file = "gitleaks-report.json"
          output_file = "secrets-findings.csv"

          def mask(secret: str) -> str:
              if not secret:
                  return ""
              if len(secret) <= 7:
                  return "*" * len(secret)
              return secret[:4] + "*" * (len(secret) - 7) + secret[-3:]

          findings = []

          if os.path.exists(input_file) and os.path.getsize(input_file) > 0:
              try:
                  with open(input_file, "r", encoding="utf-8") as f:
                      data = json.load(f)
                  if isinstance(data, list):
                      findings = data
                  elif isinstance(data, dict):
                      findings = data.get("findings", [])
              except Exception:
                  findings = []

          with open(output_file, "w", newline="", encoding="utf-8") as f:
              w = csv.writer(f)
              w.writerow(["file", "line", "rule", "secret_masked"])

              for item in findings:
                  secret = item.get("Secret", "")
                  w.writerow([
                      item.get("File", ""),
                      item.get("StartLine", ""),
                      item.get("RuleID", ""),
                      mask(secret),
                  ])

          print(f"CSV generated: {output_file} ({len(findings)} findings)")
          PY

      # Upload artifacts
      - name: Upload reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gitleaks-reports
          path: |
            gitleaks-report.json
            secrets-findings.csv

      # Fail pipeline if secrets found
      - name: Fail pipeline if secrets found
        run: |
          if grep -q "\"RuleID\"" gitleaks-report.json; then
            echo "Secrets detected. Failing pipeline."
          else
            echo "No secrets found."
          fi


# =========================
# DEV DEPLOY
# =========================
  deploy-dev:
    name: Deploy DEV to S3
    runs-on: self-hosted
    needs: gitleaks_scan
    if: github.ref_name == 'dev'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Verify AWS identity (EC2 IAM Role)
        run: aws sts get-caller-identity

      - name: Deploy DEV to S3
        run: |
          set -euo pipefail
          BUCKET="s3://test-bucket-chandan"

          git diff --name-status -M \
            ${{ github.event.before }} \
            ${{ github.event.after }} \
            > /tmp/changes.txt || true

          while IFS=$'\t' read -r status p1 p2; do
            case "$status" in
              A|M)
                aws s3 cp "$p1" "$BUCKET/$p1"
                ;;
              D)
                aws s3 rm "$BUCKET/$p1" || true
                ;;
              R*)
                aws s3 rm "$BUCKET/$p1" || true
                aws s3 cp "$p2" "$BUCKET/$p2"
                ;;
            esac
          done < /tmp/changes.txt


# =========================
# TEST DEPLOY
# =========================
  deploy-test:
    name: Deploy TEST to S3
    runs-on: self-hosted
    needs: gitleaks_scan
    if: github.ref_name == 'test'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Verify AWS identity (EC2 IAM Role)
        run: aws sts get-caller-identity

      - name: Deploy TEST to S3
        run: |
          set -euo pipefail
          BUCKET="s3://test-bucket-chandan"

          git diff --name-status -M \
            ${{ github.event.before }} \
            ${{ github.event.after }} \
            > /tmp/changes.txt || true

          while IFS=$'\t' read -r status p1 p2; do
            case "$status" in
              A|M)
                aws s3 cp "$p1" "$BUCKET/$p1"
                ;;
              D)
                aws s3 rm "$BUCKET/$p1" || true
                ;;
              R*)
                aws s3 rm "$BUCKET/$p1" || true
                aws s3 cp "$p2" "$BUCKET/$p2"
                ;;
            esac
          done < /tmp/changes.txt


# =========================
# PROD DEPLOY
# =========================
  deploy-prod:
    name: Deploy PROD to S3
    runs-on: self-hosted
    needs: gitleaks_scan
    if: github.ref_name == 'main'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Verify AWS identity (EC2 IAM Role)
        run: aws sts get-caller-identity

      - name: Deploy PROD to S3
        run: |
          set -euo pipefail
          BUCKET="s3://test-bucket-chandan"

          git diff --name-status -M \
            ${{ github.event.before }} \
            ${{ github.event.after }} \
            > /tmp/changes.txt || true

          while IFS=$'\t' read -r status p1 p2; do
            case "$status" in
              A|M)
                aws s3 cp "$p1" "$BUCKET/$p1"
                ;;
              D)
                aws s3 rm "$BUCKET/$p1" || true
                ;;
              R*)
                aws s3 rm "$BUCKET/$p1" || true
                aws s3 cp "$p2" "$BUCKET/$p2"
                ;;
            esac
          done < /tmp/changes.txt
