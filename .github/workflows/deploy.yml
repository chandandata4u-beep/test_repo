name: Deploy to S3 using OIDC

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Verify assumed role
        run: aws sts get-caller-identity

      - name: Deploy only changed files to S3 (with dynamic path mapping)
        shell: bash
        run: |
          set -euo pipefail

          BUCKET="s3://chandan-cicd-test-bucket"
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"
          MAP_FILE=".cicd/s3-path-map.json"

          echo "Diffing: $BEFORE -> $AFTER"

          git diff --name-status "$BEFORE" "$AFTER" > /tmp/changes.txt || true
          cat /tmp/changes.txt

          # --- Load mapping (optional file) ---
          EXACT_B64="e30="
          PREFIX_B64="e30="

          if [[ -f "$MAP_FILE" ]]; then
            echo "Using mapping file: $MAP_FILE"
            python3 - <<'PY' > /tmp/map.env
import json, base64
p = ".cicd/s3-path-map.json"
m = json.load(open(p, "r", encoding="utf-8"))
exact = m.get("exact", {}) or {}
prefix = m.get("prefix", {}) or {}
print("EXACT_B64=" + base64.b64encode(json.dumps(exact).encode()).decode())
print("PREFIX_B64=" + base64.b64encode(json.dumps(prefix).encode()).decode())
PY
            source /tmp/map.env
          else
            echo "No mapping file found. Using default same-path deployment."
          fi

          # --- Helper: map local path -> S3 key ---
          map_to_s3_key () {
            local local_path="$1"
            python3 - <<'PY' "$local_path"
import os, json, base64, sys
local_path = sys.argv[1]

exact = json.loads(base64.b64decode(os.environ.get("EXACT_B64","e30=")).decode())
prefix = json.loads(base64.b64decode(os.environ.get("PREFIX_B64","e30=")).decode())

# Exact mapping
if local_path in exact:
    print(exact[local_path])
    sys.exit(0)

# Longest prefix match
best_src = None
best_dst = None
for src, dst in prefix.items():
    if local_path.startswith(src):
        if best_src is None or len(src) > len(best_src):
            best_src, best_dst = src, dst

if best_src:
    print(best_dst + local_path[len(best_src):])
else:
    print(local_path)
PY
          }

          # --- Process changes ---
          while read -r status path rest; do
            [[ -z "${status:-}" ]] && continue

            # ignore git and workflow files
            if [[ "$path" == .git/* || "$path" == .github/* ]]; then
              continue
            fi

            case "$status" in
              A|M)
                s3_key="$(map_to_s3_key "$path")"
                echo "Uploading: $path -> $BUCKET/$s3_key"
                aws s3 cp "$path" "$BUCKET/$s3_key"
                ;;

              R*)
                old="$path"
                new="$rest"

                old_key="$(map_to_s3_key "$old")"
                new_key="$(map_to_s3_key "$new")"

                echo "Rename detected: $old -> $new"
                echo "S3: $old_key -> $new_key"

                aws s3 rm "$BUCKET/$old_key" || true
                aws s3 cp "$new" "$BUCKET/$new_key"
                ;;

              D)
                del_key="$(map_to_s3_key "$path")"
                echo "Deleting: $path -> $BUCKET/$del_key"
                aws s3 rm "$BUCKET/$del_key" || true
                ;;

              *)
                echo "Skipping status=$status path=$path"
                ;;
            esac
          done < /tmp/changes.txt
