name: Deploy to S3 using OIDC

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Verify assumed role
        run: aws sts get-caller-identity

      - name: Deploy only changed files to S3 (with optional mapping)
        shell: bash
        run: |
          set -euo pipefail

          BUCKET="s3://chandan-cicd-test-bucket"
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"
          MAP_FILE=".cicd/s3-path-map.json"

          echo "Diffing: $BEFORE -> $AFTER"
          git diff --name-status "$BEFORE" "$AFTER" > /tmp/changes.txt || true
          cat /tmp/changes.txt || true

          map_to_s3_key () {
            local local_path="$1"
            python3 -c 'import json, os, sys
p=sys.argv[1]; mf=sys.argv[2]
exact={}; prefix={}
if os.path.isfile(mf):
  m=json.load(open(mf,"r",encoding="utf-8"))
  exact=m.get("exact",{}) or {}
  prefix=m.get("prefix",{}) or {}
if p in exact:
  print(exact[p]); sys.exit(0)
best_src=None; best_dst=None
for src,dst in prefix.items():
  if p.startswith(src) and (best_src is None or len(src)>len(best_src)):
    best_src=src; best_dst=dst
print((best_dst + p[len(best_src):]) if best_src else p)
' "$local_path" "$MAP_FILE"
          }

          # git diff --name-status is TAB-separated; rename lines have 3 columns.
          while IFS=$'\t' read -r status path rest; do
            [[ -z "${status:-}" ]] && continue

            # Ignore meta files
            if [[ "$path" == .git/* || "$path" == .github/* ]]; then
              continue
            fi

            case "$status" in
              A|M)
                s3_key="$(map_to_s3_key "$path")"
                echo "Uploading: $path -> $BUCKET/$s3_key"
                aws s3 cp "$path" "$BUCKET/$s3_key"
                ;;
              D)
                del_key="$(map_to_s3_key "$path")"
                echo "Deleting: $path -> $BUCKET/$del_key"
                aws s3 rm "$BUCKET/$del_key" || true
                ;;
              R*)
                old="$path"
                new="$rest"

                # Ignore meta files on rename target too
                if [[ "$new" == .git/* || "$new" == .github/* ]]; then
                  continue
                fi

                old_key="$(map_to_s3_key "$old")"
                new_key="$(map_to_s3_key "$new")"

                echo "Rename: $old -> $new"
                echo "S3: $old_key -> $new_key"

                aws s3 rm "$BUCKET/$old_key" || true
                aws s3 cp "$new" "$BUCKET/$new_key"
                ;;
              *)
                echo "Skipping: status=$status path=$path rest=${rest:-}"
                ;;
            esac
          done < /tmp/changes.txt
