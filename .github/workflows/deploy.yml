name: Deploy to S3 using OIDC

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Verify assumed role
        run: aws sts get-caller-identity

      - name: Deploy only changed files to S3 (with mapping)
        shell: bash
        run: |
          set -euo pipefail

          BUCKET="s3://chandan-cicd-test-bucket"
          MAPPING_FILE=".cicd/s3-path-map.json"

          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"

          echo "Diffing: $BEFORE -> $AFTER"

          # Ensure we have the 'before' commit available even with shallow checkout
          if ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "BEFORE commit not present locally (shallow clone). Fetching more history..."
            git fetch --no-tags --prune --depth=50 origin "${{ github.ref_name }}"
          fi

          # If still not present (e.g., first push / new branch), fallback safely
          if ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "BEFORE commit still not available. Falling back to previous commit (if exists)."
            if git rev-parse HEAD^ >/dev/null 2>&1; then
              BEFORE="$(git rev-parse HEAD^)"
              echo "Using fallback BEFORE=$BEFORE"
            else
              echo "No previous commit exists; deploying all tracked files."
              git ls-files > /tmp/all_files.txt
              : > /tmp/changes.txt
              while read -r f; do
                echo -e "A\t$f" >> /tmp/changes.txt
              done < /tmp/all_files.txt
            fi
          fi

          # If changes.txt not created by fallback above, generate from diff
          if [ ! -f /tmp/changes.txt ]; then
            git diff --name-status -M --find-renames "$BEFORE" "$AFTER" > /tmp/changes.txt || true
          fi

          echo "---- CHANGES ----"
          cat /tmp/changes.txt || true
          echo "-----------------"

          # Mapping loader (jq). If mapping file missing/invalid -> treat as empty mapping.
          if [ -f "$MAPPING_FILE" ]; then
            if ! jq -e . "$MAPPING_FILE" >/dev/null 2>&1; then
              echo "WARNING: $MAPPING_FILE exists but is not valid JSON. Mapping will be ignored."
              HAS_MAPPING="0"
            else
              HAS_MAPPING="1"
            fi
          else
            echo "INFO: $MAPPING_FILE not found. Proceeding without mapping."
            HAS_MAPPING="0"
          fi

          # Convert local repo path -> S3 key using mapping rules
          map_dest_key() {
            local src="$1"
            local dest="$src"

            if [ "$HAS_MAPPING" = "1" ]; then
              # exact mapping
              local exact
              exact="$(jq -r --arg s "$src" '.exact[$s] // empty' "$MAPPING_FILE")"
              if [ -n "${exact:-}" ]; then
                echo "$exact"
                return 0
              fi

              # prefix mapping (longest prefix wins)
              # prefix object is like: { "script/": "misc/scripts/" }
              local best_src=""
              local best_dest=""

              while IFS=$'\t' read -r k v; do
                # k/v come from jq as tab-separated
                if [[ "$src" == "$k"* ]]; then
                  if [ "${#k}" -gt "${#best_src}" ]; then
                    best_src="$k"
                    best_dest="$v"
                  fi
                fi
              done < <(jq -r '.prefix // {} | to_entries[] | "\(.key)\t\(.value)"' "$MAPPING_FILE" 2>/dev/null || true)

              if [ -n "${best_src:-}" ]; then
                dest="${best_dest}${src#${best_src}}"
              fi
            fi

            echo "$dest"
          }

          # helper: upload one file safely
          upload_file() {
            local src="$1"
            local key="$2"

            if [ ! -f "$src" ]; then
              echo "WARNING: Source file not found (skipping): $src"
              return 0
            fi

            echo "Uploading: $src -> $BUCKET/$key"
            aws s3 cp "$src" "$BUCKET/$key"
          }

          # helper: delete key safely
          delete_key() {
            local key="$1"
            echo "Deleting: $BUCKET/$key"
            aws s3 rm "$BUCKET/$key" || true
          }

          # Nothing changed? Exit cleanly.
          if [ ! -s /tmp/changes.txt ]; then
            echo "No changes detected. Exiting."
            exit 0
          fi

          # Process diff lines
          while IFS=$'\t' read -r status p1 p2; do
            [ -z "${status:-}" ] && continue

            # ignore internal paths
            if [[ "${p1:-}" == .git/* || "${p1:-}" == .github/* ]]; then
              continue
            fi
            if [[ "${p2:-}" == .git/* || "${p2:-}" == .github/* ]]; then
              continue
            fi

            case "$status" in
              A|M)
                dest="$(map_dest_key "$p1")"
                upload_file "$p1" "$dest"
                ;;

              D)
                dest="$(map_dest_key "$p1")"
                delete_key "$dest"
                ;;

              R* )
                # rename: p1=old, p2=new
                old_dest="$(map_dest_key "$p1")"
                new_dest="$(map_dest_key "$p2")"

                echo "Rename detected: $p1 -> $p2"
                delete_key "$old_dest"
                upload_file "$p2" "$new_dest"
                ;;

              * )
                echo "Skipping status=$status p1=${p1:-} p2=${p2:-}"
                ;;
            esac
          done < /tmp/changes.txt
