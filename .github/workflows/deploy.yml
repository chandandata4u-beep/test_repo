name: Secure Deploy to S3 (OIDC + Gitleaks Gate)

on:
  push:
    branches: ["dev", "test", "main"]

jobs:

# =========================
# SECURITY SCAN (GITLEAKS)
# =========================
  gitleaks_scan:
    name: Security Scan (Gitleaks)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Gitleaks (JSON report)
        run: |
          set +e

          docker run --rm \
            -v "$PWD:/repo" \
            -w /repo \
            zricethezav/gitleaks:latest \
            detect \
              --source . \
              --no-git \
              --config /repo/.gitleaks.toml \
              --report-format json \
              --report-path /repo/gitleaks-report.json \
              --exit-code 1

          EXIT_CODE=$?
          echo "exit_code=$EXIT_CODE" > gitleaks-status.txt

      - name: Ensure report exists
        run: |
          if [ ! -s gitleaks-report.json ]; then
            echo "[]" > gitleaks-report.json
          fi

      - name: Convert JSON -> CSV (masked secrets)
        run: |
          python3 - <<'PY'
          import json, csv, os

          input_file = "gitleaks-report.json"
          output_file = "secrets-findings.csv"

          def mask(secret: str) -> str:
              if not secret:
                  return ""
              if len(secret) <= 7:
                  return "*" * len(secret)
              return secret[:4] + "*" * (len(secret) - 7) + secret[-3:]

          findings = []

          if os.path.exists(input_file) and os.path.getsize(input_file) > 0:
              try:
                  with open(input_file, "r", encoding="utf-8") as f:
                      data = json.load(f)
                  if isinstance(data, list):
                      findings = data
                  elif isinstance(data, dict):
                      findings = data.get("findings", [])
              except Exception:
                  findings = []

          with open(output_file, "w", newline="", encoding="utf-8") as f:
              w = csv.writer(f)
              w.writerow(["file", "line", "rule", "secret_masked"])

              for item in findings:
                  secret = item.get("Secret", "")
                  w.writerow([
                      item.get("File", ""),
                      item.get("StartLine", ""),
                      item.get("RuleID", ""),
                      mask(secret),
                  ])

          print(f"CSV generated: {output_file} ({len(findings)} findings)")
          PY

      - name: Upload reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gitleaks-reports
          path: |
            gitleaks-report.json
            secrets-findings.csv

      - name: Fail pipeline if secrets found
        run: |
          if grep -q "\"RuleID\"" gitleaks-report.json; then
            echo "❌ Secrets detected. Failing pipeline."
            exit 1
          else
            echo "✅ No secrets found."
          fi


# =========================
# DEV DEPLOY
# =========================
  deploy-dev:
    name: Deploy DEV to S3
    runs-on: ubuntu-latest
    needs: gitleaks_scan
    if: github.ref_name == 'main'

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Deploy to S3 (MAIN)
        shell: bash
        run: |
          set -euo pipefail

          BUCKET="s3://test-bucket-chandan"
          MAPPING_FILE=".cicd/s3-path-map.json"

          echo "Deploying MAIN..."

          git fetch origin ${{ github.ref_name }} --depth=50

          git diff --name-status -M \
            ${{ github.event.before }} \
            ${{ github.event.after }} \
            > /tmp/changes.txt || true

          echo "Deploying MAIN..."

          upload_file() {
            [ -f "$1" ] || return 0
            aws s3 cp "$1" "$BUCKET/$2"
          }

          map_dest_key() {
            echo "$1"
          }

          while IFS=$'\t' read -r status p1 p2; do
            case "$status" in
              A|M)
                upload_file "$p1" "$(map_dest_key "$p1")"
                ;;
              D)
                aws s3 rm "$BUCKET/$(map_dest_key "$p1")" || true
                ;;
              R*)
                aws s3 rm "$BUCKET/$(map_dest_key "$p1")" || true
                upload_file "$p2" "$(map_dest_key "$p2")"
                ;;
            esac
          done < /tmp/changes.txt


# =========================
# TEST DEPLOY
# =========================
  deploy-test:
    name: Deploy TEST to S3
    runs-on: ubuntu-latest
    needs: gitleaks_scan
    if: github.ref_name == 'test'

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy TEST
        run: |
          echo "TEST deploy logic stays same"


# =========================
# PROD DEPLOY
# =========================
  deploy-prod:
    name: Deploy PROD to S3
    runs-on: ubuntu-latest
    needs: gitleaks_scan
    if: github.ref_name == 'dev'

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy PROD
        run: |
          echo "PROD deploy logic stays same"
