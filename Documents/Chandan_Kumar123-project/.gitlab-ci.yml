stages:
  - security


gitleaks_scan:
  stage: security
  image:
    name: zricethezav/gitleaks:latest
    entrypoint: [""]
  script:
    - 'echo "Running gitleaks secret scan (using .gitleaks.toml)..."'
    - 'test -f .gitleaks.toml || (echo "ERROR: .gitleaks.toml not found at repo root" && exit 2)'
    - 'gitleaks detect --source . --no-git --config .gitleaks.toml --report-format json --report-path gitleaks-report.json --exit-code 1 || true'
    - 'test -f gitleaks-report.json || echo "[]" > gitleaks-report.json'
    - 'echo "Gitleaks scan completed. Report saved to gitleaks-report.json"'
    - 'echo "Findings (approx): $(grep -c "\"RuleID\"" gitleaks-report.json 2>/dev/null || echo 0)"'
  artifacts:
    when: always
    paths:
      - gitleaks-report.json
  allow_failure: true


convert_secret_report:
  stage: security
  image: python:3.11
  needs:
    - job: gitleaks_scan
      artifacts: true
      optional: true
  script:
    - 'echo "Generating secrets-findings.csv and emailing if secrets found..."'
    - |
      cat > convert_gitleaks.py <<'PY'
      import json, csv, os, smtplib
      from email.mime.text import MIMEText
      from email.mime.multipart import MIMEMultipart

      inp = "gitleaks-report.json"
      out = "secrets-findings.csv"

      if os.path.exists(inp) and os.path.getsize(inp) > 0:
          with open(inp, "r", encoding="utf-8") as f:
              data = json.load(f)
          findings = data if isinstance(data, list) else data.get("findings", [])
      else:
          findings = []

      def mask(v: str) -> str:
          if not v:
              return ""
          return v[:4] + "*" * max(0, len(v) - 7) + v[-3:]

      with open(out, "w", newline="", encoding="utf-8") as f:
          w = csv.writer(f)
          w.writerow(["file", "line", "rule", "secret_masked"])
          for i in findings:
              w.writerow([i.get("File"), i.get("StartLine"), i.get("RuleID"), mask(i.get("Secret", ""))])

      n = len(findings)
      print(f"CSV generated: {out} ({n} secrets)")

      if n <= 0:
          print("No secrets found. No email sent.")
          raise SystemExit(0)

      smtp = os.getenv("SMTP_HOST")
      port = int(os.getenv("SMTP_PORT", "587"))
      ef = os.getenv("EMAIL_FROM")
      et = os.getenv("EMAIL_TO")
      user = os.getenv("SMTP_USER")
      pwd = os.getenv("SMTP_PASSWORD")

      if not smtp or not ef or not et:
          print("SMTP_HOST / EMAIL_FROM / EMAIL_TO not set. Skipping email.")
          raise SystemExit(0)

      if not user or not pwd:
          print("SMTP_USER / SMTP_PASSWORD not set. Skipping email.")
          raise SystemExit(0)

      proj = os.getenv("CI_PROJECT_PATH", "")
      br = os.getenv("CI_COMMIT_REF_NAME", "")
      sha = os.getenv("CI_COMMIT_SHA", "")
      url = os.getenv("CI_PIPELINE_URL", "")

      subject = f"[ALERT] Secrets detected: {proj}"
      body = f"""Secrets were detected in the repository.

      Project : {proj}
      Branch  : {br}
      Commit  : {sha}
      Pipeline: {url}

      Total secrets found: {n}

      Please check pipeline artifacts:
      - gitleaks-report.json
      - secrets-findings.csv
      """

      msg = MIMEMultipart()
      msg["From"] = ef
      msg["To"] = et
      msg["Subject"] = subject
      msg.attach(MIMEText(body, "plain"))

      try:
          s = smtplib.SMTP(smtp, port, timeout=20)
          s.ehlo()
          s.starttls()
          s.ehlo()
          s.login(user, pwd)
          recipients = [x.strip() for x in et.split(",") if x.strip()]
          s.sendmail(ef, recipients, msg.as_string())
          s.quit()
          print("Email notification sent.")
      except Exception as e:
          print("Email send failed (non-blocking):", repr(e))
      PY
      python convert_gitleaks.py
  artifacts:
    when: always
    paths:
      - secrets-findings.csv

pylint_scan:
  stage: security
  image: python:3.11
  needs:
    - job: convert_secret_report
      artifacts: true
      optional: true
  script:
    - 'pip install --no-cache-dir pylint'
    - 'echo "Running pylint scan on Python files..."'
    - |
      FILES="$(git ls-files '*.py')"
      if [ -z "$FILES" ]; then
        echo "No Python files found. Skipping pylint."
        echo "[]" > pylint-report.json
      else
        pylint $FILES --output-format=json > pylint-report.json || true
      fi
    - 'echo "Generating pylint-findings.csv..."'
    - |
      python - <<'PY'
      import json, csv, os

      jf = "pylint-report.json"
      cf = "pylint-findings.csv"

      with open(cf, "w", newline="", encoding="utf-8") as f:
          w = csv.writer(f)
          w.writerow(["file", "line", "message", "severity", "rule"])

          if os.path.exists(jf) and os.path.getsize(jf) > 0:
              issues = json.load(open(jf, "r", encoding="utf-8"))
              for i in issues:
                  w.writerow([i.get("path"), i.get("line"), i.get("message"), i.get("type"), i.get("symbol")])

      print("pylint-findings.csv created")
      PY
  artifacts:
    when: always
    paths:
      - pylint-report.json
      - pylint-findings.csv
