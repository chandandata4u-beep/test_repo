title = "Gitleaks Rules - Robust, Low-Noise"

# ============================================================
# GLOBAL ALLOWLIST
# ============================================================
[allowlist]
description = "Allow dummy/mock secrets in test directories"
paths = [
  '''\.git/''',
  '''node_modules/''',
  '''venv/''',
  '''dist/''',
  '''build/''',
  '''__pycache__/'''
]

regexes = [
  '''(?i)(password|pass|pwd)\s*[:=]\s*["']?(admin|test|dummy|example|changeme)["']?''',
  '''(?i)(user(name)?)\s*[:=]\s*["']?(admin|test|user)["']?'''
]

# ============================================================
# AWS ACCESS KEY
# ============================================================
[[rules]]
id = "aws-access-key-id"
description = "AWS Access Key"
regex = '''\b(AKIA[0-9A-Z]{16})\b'''
secretGroup = 1
tags = ["aws", "high"]

# ============================================================
# URL EMBEDDED CREDENTIALS
# ============================================================
[[rules]]
id = "url-credentials"
description = "Credentials in URL"
regex = '''(?i)(https?:\/\/[^:\s]+:[^@\s]+@[^\/\s]+)'''
secretGroup = 1
tags = ["credentials", "url"]

# ============================================================
# High Entropy Detection (VALUE-ONLY, filtered by pattern)
# ============================================================
[[rules]]
id = "hybrid-secret-detection"
description = "Detect high-entropy secrets without capturing method/class names"
regex = '''["']([A-Za-z\d@#$%^&*!]{8,40}[@#$%^&*!]+[A-Za-z\d@#$%^&*!]{0,40})["']'''
secretGroup = 1
entropy = 3
tags = ["entropy", "secret"]



# ============================================================
# JINJA
# ============================================================
[[rules]]
id = "jinja-secret"
description = "Detect secrets inside Jinja templates (filtered)"
regex = '''\{\{\s*['"]([A-Za-z0-9@#$%^&!_\-]{8,})['"]\s\}\}'''
secretGroup = 1
entropy = 3.2
tags = ["jinja", "secret"]

# ============================================================
# SQL INSERT CREDENTIALS
# ============================================================
[[rules]]
id = "sql-insert-positional-secrets"
description = "Detect possible secrets in SQL INSERT values"
regex = '''(?i)VALUES\s*\([^\)]*['"]([^'"]{6,})['"]'''
secretGroup = 1
path = '''(?i)\.sql$'''
tags = ["sql", "credentials"]

# ============================================================
# GITHUB TOKENS
# ============================================================
[[rules]]
id = "github-token"
description = "GitHub Token"
regex = '''(gh[pousr]_[A-Za-z0-9]{20,})'''
secretGroup = 1
tags = ["github", "token"]
